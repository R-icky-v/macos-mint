backend = "glx";
vsync = true;
corner-radius = 20;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Plank'",
  "class_g = 'Xfce4-panel'",
  "window_type = 'desktop'"
];
shadow = true;
shadow-radius = 25;
shadow-opacity = 0.35;
shadow-offset-x = -15;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Plank'"
];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 2;
blur-background-exclude = [
  "class_g = 'Plank'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Popups del panel: sin fade, sombra ni blur (el segundo clic no los cerraba)
wintypes:
{
  popup_menu    = { fade = false; shadow = false; blur-background = false; };
  dropdown_menu = { fade = false; shadow = false; blur-background = false; };
  tooltip       = { fade = false; shadow = false; };
  utility       = { fade = false; shadow = false; };
};

opacity-rule = [ "85:class_g = 'alttab'", "85:class_g = 'Alttab'" ];
